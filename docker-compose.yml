services:
  qipai-server:
    build: .
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      DATA_DIR: /data
      SESSION_TTL_MS: "86400000"
    volumes:
      - qipai-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  qipai-data:
